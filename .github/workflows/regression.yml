name: CashMesh browser regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node tests/regression.cjs
      - run: node tests/pdf-import.mjs
      - run: node tests/pdf-review.cjs
      - run: node tests/icbc-layout.mjs
      - run: npm run test:dom
      - run: node tests/auto-organize.cjs
      - run: node tests/pdf-cleanup.mjs
      - run: node tests/cleanup-dom.mjs
      - run: node tests/default-funding.cjs
      - run: node tests/funding-review-dom.mjs
      - run: node tests/direction.cjs
      - run: node tests/budget-estimate.cjs
      - run: node tests/bank-columns.mjs
      - run: node tests/spending-history.cjs
      - run: node tests/history-dom.mjs
      - run: node tests/setup-assessment-dom.mjs
