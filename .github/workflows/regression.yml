name: CashMesh browser regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node tests/regression.cjs
      - run: node tests/pdf-import.mjs
      - run: node tests/pdf-review.cjs
      - run: node tests/icbc-layout.mjs
      - run: npm run test:dom
      - run: node tests/auto-organize.cjs
      - run: node tests/pdf-cleanup.mjs
      - run: node tests/cleanup-dom.mjs
      - run: node tests/default-funding.cjs
      - run: node tests/funding-review-dom.mjs
      - run: node tests/direction.cjs
      - run: node tests/budget-estimate.cjs
      - run: node tests/bank-columns.mjs
      - run: node tests/spending-history.cjs
      - run: node tests/history-dom.mjs
      - run: node tests/setup-assessment-dom.mjs
      - run: node tests/combined-settings-style.mjs
      - run: node tests/table-selection-dom.mjs
      - run: node tests/confirm-all-cash-dom.mjs
      - run: node tests/semantic-classification.cjs
      - run: node tests/credit-dashboard.mjs
      - run: node tests/notifications-dom.mjs
      - run: node tests/synthetic-profile-dom.mjs
      - run: node tests/screenshot-dom.mjs
      - run: node tests/screenshot-accuracy.mjs
      - run: node tests/journal-dom.mjs
      - run: node tests/cloud-db.mjs
      - run: node tests/wechat-amount.mjs
      - run: node tests/payment-account.mjs
      - run: node tests/platform-merchant.mjs
      - run: node tests/account-picker.mjs
      - run: node tests/deferred-price.mjs
      - run: node tests/account-manager.mjs
      - run: node tests/platform-consistency.mjs
      - run: node tests/journal-isolation-repayment.mjs
